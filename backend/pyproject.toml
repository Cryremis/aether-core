# backend/pyproject.toml
[project]
name = "aethercore-backend"
version = "0.1.0"
description = "AetherCore 独立 Agent Runtime 后端服务"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic-settings>=2.10.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
    "jsonschema>=4.23.0",
    "python-jose>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-xdist>=3.6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 默认并行执行(可用 -n 0 退回串行);网络依赖测试需 AETHERCORE_NETWORK_TESTS=1 显式启用
addopts = "-n auto"
